# nginx — manifesto completo
#
# Substitui o Deployment criado à mão em `default` com `image: ngin` (typo, sem
# tag, sem resources, sem probe). Aquele objeto não vinha de manifesto nenhum —
# não tinha last-applied-configuration.
#
# Contrato lido da imagem oficial, não suposto:
#   porta 80 ............... diretiva `listen` do conf.d/default.conf da imagem
#   GET /health ............ criado no ConfigMap abaixo → liveness
#   GET /ready ............. criado no ConfigMap abaixo → readiness
#
# A imagem base do nginx só serve `/`. Em vez de apontar liveness e readiness
# para a mesma rota (o que apagaria a distinção entre as duas), a config abaixo
# cria dois endpoints com semânticas diferentes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: nginx-dev
    app.kubernetes.io/part-of: nginx
    app.kubernetes.io/managed-by: kubectl
# >>> config-hash-inicio — tudo entre estes marcadores entra no checksum/config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: nginx-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: nginx
    app.kubernetes.io/managed-by: kubectl
data:
  # Sobrescreve o /etc/nginx/conf.d/default.conf que vem na imagem.
  default.conf: |
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Liveness: responde pelo processo. O worker do nginx está aceitando e
        # roteando requisição? Não toca em disco nem em dependência externa.
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Readiness: pergunta diferente — o conteúdo que este pod deve servir
        # está de fato no disco? Se o volume sumir, /health segue 200 e /ready
        # devolve 404, e o pod sai do Service sem ser reiniciado à toa.
        location = /ready {
            access_log off;
            try_files /index.html =404;
            root /usr/share/nginx/html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
# <<< config-hash-fim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: nginx-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: nginx
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "1.30.4"   # varia com o release → fora do selector
spec:
  replicas: 2
  selector:
    matchLabels:                          # imutável: só name + instance
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: nginx-dev
  template:
    metadata:
      labels:                             # superconjunto do selector
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: nginx-dev
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: nginx
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/version: "1.30.4"
      annotations:
        # sha256 do bloco de config deste arquivo. Mudou a config, mudou o
        # template, o Deployment faz rollout sozinho. Recalcule com:
        #   awk '/^# >>> config-hash-inicio/,/^# <<< config-hash-fim/' k8s/nginx.yaml | shasum -a 256
        checksum/config: "2e4289d2b6590adeb00e741f7bcacd4fa7f49085c71c6f67047915201e2098f1"
    spec:
      containers:
        - name: nginx
          # Tag fixa na linha stable do nginx (minor par). Nunca `latest`: dois
          # pods do mesmo Deployment poderiam rodar conteúdo diferente, e o
          # rollout undo voltaria para a mesma tag móvel.
          image: nginx:1.30.4-alpine
          imagePullPolicy: IfNotPresent   # coerente com tag fixa
          ports:
            - name: http                  # o Service aponta para o nome
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          # nginx sobe em milissegundos: não há boot lento a cobrir, então não
          # há startupProbe aqui. Ponto de partida para conteúdo estático;
          # ajuste com o consumo real medido.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 64Mi              # travada: memória não é compressível
          livenessProbe:
            # Só o processo — nada de dependência externa
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3         # tolerante: matar o pod é caro
          readinessProbe:
            # Endpoint distinto, com semântica própria de prontidão
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2         # agressiva: sair do Service é barato
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: nginx-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: nginx
    app.kubernetes.io/managed-by: kubectl
spec:
  # ClusterIP porque nada indica que este nginx seja borda. Um LoadBalancer aqui
  # provisionaria um balanceador de verdade na AWS, com IP público e fatura, para
  # tráfego que ninguém pediu para sair do cluster. Se um dia for borda, o
  # kube-news já mostra o caminho — ou um Ingress, se virarem dois expostos.
  type: ClusterIP
  selector:                 # casa com as labels do pod template
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: nginx-dev
  ports:
    - name: http
      port: 80
      targetPort: http      # nome da porta do container, não número
      protocol: TCP
