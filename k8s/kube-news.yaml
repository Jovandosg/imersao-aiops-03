# kube-news — manifesto completo (aplicação + PostgreSQL)
#
# Contrato lido do código, não suposto:
#   porta 8080 ............ src/server.js:81   (app.listen(8080), sem env PORT)
#   GET /health ........... src/system-life.js:22  → liveness (só o processo)
#   GET /ready ............ src/system-life.js:11  → readiness
#   variáveis DB_* ........ src/models/post.js:8-13
#
# ATENÇÃO — o banco NÃO tem volume (pedido explícito): os dados vivem na camada
# gravável do container e são PERDIDOS a cada restart, rollout ou reagendamento
# do pod. Serve para lab/demo; não use assim com dado que importa.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: kube-news-dev
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
# >>> config-hash-inicio — tudo entre estes marcadores entra no checksum/config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-news-config
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: kube-news-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
data:
  # Chaves e defaults conferidos em src/models/post.js — nenhuma variável inventada.
  DB_HOST: postgres.kube-news.svc.cluster.local
  DB_PORT: "5432"          # aspas: todo valor de ConfigMap é string
  DB_DATABASE: kubedevnews # fonte única do nome do banco: o Postgres lê esta mesma chave
  DB_SSL_REQUIRE: "false"  # o código compara com a string 'true' (strToBool)
---
apiVersion: v1
kind: Secret
metadata:
  name: kube-news-db
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: kube-news-dev
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # Chaves neutras: a aplicação as recebe como DB_USERNAME/DB_PASSWORD e o Postgres
  # como POSTGRES_USER/POSTGRES_PASSWORD. Um valor só, sem risco de divergir.
  username: kubedevnew
  # Secret é base64, não criptografia: o valor real NÃO vai versionado preenchido.
  # Substitua no apply pelo valor do gerenciador de secrets.
  # Se um literal precisar aparecer, o '#' exige aspas: "Pg#123"
  password: "<DB_PASSWORD>"
# <<< config-hash-fim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kube-news
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "16"
spec:
  replicas: 1
  strategy:
    # Sem volume, duas instâncias simultâneas serviriam dados diferentes durante
    # o rollout. Recreate derruba a antiga antes de subir a nova.
    type: Recreate
  selector:
    matchLabels:                          # imutável: só name + instance
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres-dev
  template:
    metadata:
      labels:                             # superconjunto do selector
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres-dev
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: kube-news
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/version: "16"
      annotations:
        checksum/config: "807a850e1c0879b3723c5a0b54402f0197767f64a6c2cb174a113ff13a96a75d"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine       # tag fixa; a mesma do docker-compose.yml
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # Chave a chave: o nome da variável no container difere da chave do objeto.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: kube-news-config
                  key: DB_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi               # travada: memória não é compressível
          startupProbe:
            # A primeira subida roda o initdb e cria o banco — é isso que a startup cobre.
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 5
            failureThreshold: 24          # até ~120s de boot
          livenessProbe:
            # Só o processo: o postmaster está aceitando conexão? Nada de query.
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3           # tolerante: matar o pod é caro
          readinessProbe:
            # Pergunta diferente: dá para executar query no banco da aplicação, com o
            # usuário dela? Via socket local (pg_hba: local all all trust na imagem).
            exec:
              command:
                - sh
                - -c
                - psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT 1' > /dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2           # agressiva: sair do Service é barato
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kube-news
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP           # banco é consumido só de dentro do cluster
  selector:                 # casa com as labels do pod template do Postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-dev
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres  # nome da porta do container, não número
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: kube-news-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "v1"       # varia com o release → fora do selector
spec:
  replicas: 2
  selector:
    matchLabels:                          # imutável: só name + instance
      app.kubernetes.io/name: kube-news
      app.kubernetes.io/instance: kube-news-dev
  template:
    metadata:
      labels:                             # superconjunto do selector
        app.kubernetes.io/name: kube-news
        app.kubernetes.io/instance: kube-news-dev
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: kube-news
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/version: "v1"
      annotations:
        # sha256 do bloco de config deste arquivo. Mudou a config, mudou o template,
        # o Deployment faz rollout sozinho — sem isto o pod segue com o valor antigo
        # e nada avisa. Recalcule com:
        #   awk '/^# >>> config-hash-inicio/,/^# <<< config-hash-fim/' k8s/kube-news.yaml | shasum -a 256
        checksum/config: "807a850e1c0879b3723c5a0b54402f0197767f64a6c2cb174a113ff13a96a75d"
    spec:
      initContainers:
        # A aplicação faz exit 1 se o banco não aceitar conexão no boot
        # (sequelize.sync em src/models/post.js:59). Um processo que MORRE não é
        # coberto por startupProbe — a probe só cobre boot lento, e o container já
        # terminou. Sem este init, o pod entra em CrashLoopBackOff até o banco subir.
        - name: wait-postgres
          image: postgres:16-alpine     # tag fixa; pg_isready já vem na imagem
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT"; do sleep 2; done
          envFrom:
            - configMapRef:
                name: kube-news-config  # DB_HOST e DB_PORT vêm daqui, sem literal
          resources:                    # init disputa o mesmo nó: recurso declarado
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: web
          image: fabricioveronez/kube-news:v1
          imagePullPolicy: IfNotPresent   # coerente com tag fixa
          ports:
            - name: http                  # o Service aponta para o nome
              containerPort: 8080         # src/server.js:81 — app.listen(8080)
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kube-news-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: password
          # Memória travada (não é compressível), CPU com folga deliberada.
          # Ponto de partida para Express + Sequelize: ajuste com o consumo real.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            # Cobre o boot lento em si (sequelize.sync alterando schema) depois que o
            # banco já responde — quem espera o banco é o initContainer acima.
            # Boot lento é startupProbe; boot que morre é initContainer.
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30          # até ~150s de boot
          livenessProbe:
            # /health responde só pelo processo — não toca no banco
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3           # tolerante: matar o pod é caro
          readinessProbe:
            # /ready é endpoint distinto, com semântica própria de prontidão
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2           # agressiva: sair do Service é barato
---
apiVersion: v1
kind: Service
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: kube-news-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kube-news
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # Sem o AWS Load Balancer Controller instalado, quem provisiona é o cloud
    # provider nativo do EKS. Sem esta annotation ele cria um Classic LB (legado);
    # com ela, um Network Load Balancer.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  # Esta aplicação É a borda: recebe tráfego de fora do cluster. É o caso legítimo
  # de LoadBalancer — e provisiona um NLB de verdade na AWS, com custo mensal.
  # Se um dia houver mais de um serviço exposto, um Ingress passa a valer mais que
  # um LB por Service.
  type: LoadBalancer
  selector:                 # casa com as labels do pod template da aplicação
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: kube-news-dev
  ports:
    - name: http
      port: 80
      targetPort: http      # nome da porta do container, não número
      protocol: TCP
