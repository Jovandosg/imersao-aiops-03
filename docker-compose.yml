name: kube-news

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kube-news:local
    restart: unless-stopped
    environment:
      # Única variável que muda em relação ao default do código:
      # localhost vira o nome do serviço na rede do compose.
      DB_HOST: db
      # As demais herdam exatamente os defaults de src/models/post.js.
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-kubedevnews}"
      DB_USERNAME: "${DB_USERNAME:-kubedevnews}"
      DB_PASSWORD: "${DB_PASSWORD:-Pg#123}"
      DB_SSL_REQUIRE: "${DB_SSL_REQUIRE:-false}"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kube-news

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-kubedevnews}"
      POSTGRES_USER: "${DB_USERNAME:-kubedevnews}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-Pg#123}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-kubedevnews} -d ${DB_DATABASE:-kubedevnews}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      # Publicado só no loopback — a aplicação alcança o banco pela rede do compose.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    networks:
      - kube-news

volumes:
  pgdata:

networks:
  kube-news:
